<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SHADOW FLIP // Reversal Protocol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f0ff;
      --cyan-dim: #00a0b0;
      --orange: #ff7700;
      --violet: #d000ff;
      --red: #ff3344;
      --bg: #03070d;
      --panel-bg: rgba(6, 14, 25, 0.92);
      --border: rgba(0, 240, 255, 0.35);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #0d1a2d 0%, #03070d 80%);
      color: #e0f4ff;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Top cyber header */
    #top-nav {
      width: 960px;
      max-width: 98vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
      font-size: 13px;
      letter-spacing: 1px;
    }
    .nav-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 16px;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
    }
    .badge {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--cyan-dim);
      padding: 2px 7px;
      border-radius: 3px;
      color: var(--cyan);
      font-size: 11px;
      text-transform: uppercase;
    }
    .badge.phase {
      background: rgba(255, 119, 0, 0.15);
      border-color: var(--orange);
      color: var(--orange);
    }
    .nav-controls {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    /* Viewport Frame */
    #game-container {
      position: relative;
      width: 960px;
      height: 640px;
      max-width: 98vw;
      max-height: 65.3vw;
      background: #020408;
      border: 1px solid var(--border);
      border-radius: 0 0 6px 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 240, 255, 0.15);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* CRT scanline overlay */
    #crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  radial-gradient(circle at center, transparent 70%, rgba(0, 0, 0, 0.4) 100%);
      background-size: 100% 3px, 100% 100%;
      opacity: 0.7;
    }

    /* Cyber bottom control bar */
    #bottom-bar {
      width: 960px;
      max-width: 98vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      margin-top: 6px;
      background: rgba(5, 12, 20, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 4px;
      font-size: 11px;
      color: #8bb3cb;
    }
    .key-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-right: 12px;
    }
    .key {
      display: inline-block;
      padding: 2px 6px;
      background: #091a2d;
      border: 1px solid #1f4f78;
      border-radius: 3px;
      color: var(--cyan);
      font-weight: bold;
      font-size: 10.5px;
      box-shadow: 0 2px 0 #000;
    }

    /* Modal dialog */
    #modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(1, 4, 8, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 50;
    }
    .modal-box {
      width: 580px;
      max-width: 90%;
      background: #06111f;
      border: 1px solid var(--cyan);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
      padding: 24px;
      border-radius: 4px;
      position: relative;
    }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      color: var(--cyan);
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      padding-bottom: 8px;
    }
    .modal-body {
      font-size: 13.5px;
      line-height: 1.6;
      color: #c9e8fb;
      margin-bottom: 20px;
      white-space: pre-line;
      min-height: 80px;
    }
    .modal-btn {
      display: block;
      margin-left: auto;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 24px;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s ease;
    }
    .modal-btn:hover {
      background: var(--cyan);
      color: #03070d;
      box-shadow: 0 0 15px var(--cyan);
    }

    /* Glitch effect on title */
    @keyframes glitch {
      0% { text-shadow: 0 0 10px rgba(0, 240, 255, 0.8); }
      20% { text-shadow: -2px 0 #ff0055, 2px 0 #00ffff; }
      40% { text-shadow: 2px 0 #ff0055, -2px 0 #00ffff; }
      60% { text-shadow: 0 0 12px rgba(0, 240, 255, 0.9); }
      100% { text-shadow: 0 0 10px rgba(0, 240, 255, 0.8); }
    }
    .glitch-title {
      animation: glitch 3s infinite alternate;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Status -->
  <div id="top-nav">
    <div class="nav-title">
      <span class="brand glitch-title">SHADOW FLIP</span>
      <span class="badge" id="hud-level-badge">SYSTEM INITIALIZED</span>
      <span class="badge phase" id="hud-phase-badge">THEME: REVERSAL</span>
    </div>
    <div class="nav-controls">
      <button class="nav-btn" id="btn-menu">TITLE MENU</button>
      <button class="nav-btn" id="btn-tutorial">TUTORIAL</button>
      <button class="nav-btn" id="btn-restart">RESET [R]</button>
      <button class="nav-btn" id="btn-sound">SOUND: ON</button>
      <button class="nav-btn" id="btn-fullscreen">FULLSCREEN</button>
    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <canvas id="game-canvas" width="960" height="640"></canvas>
    <div id="crt-overlay"></div>

    <!-- Interactive Terminal Modal -->
    <div id="modal-overlay">
      <div class="modal-box">
        <div class="modal-header">
          <span style="font-size:20px;">⚡</span>
          <span id="modal-title">ARCHIVE TERMINAL DATA</span>
        </div>
        <div class="modal-body" id="modal-text"></div>
        <button class="modal-btn" id="modal-close-btn">ACKNOWLEDGE [SPACE / ENTER]</button>
      </div>
    </div>
  </div>

  <!-- Cyber Key Legend -->
  <div id="bottom-bar">
    <div>
      <span class="key-group"><span class="key">A</span><span class="key">D</span> Move</span>
      <span class="key-group"><span class="key">W</span> Jump</span>
      <span class="key-group"><span class="key">SPACE</span> Deploy Shadow</span>
      <span class="key-group"><span class="key">F</span> <strong style="color:var(--orange);">Shadow Flip (REVERSE)</strong></span>
      <span class="key-group"><span class="key">E</span> Interact / Read</span>
      <span class="key-group"><span class="key">R</span> Quick Reset</span>
    </div>
    <div style="color:var(--cyan); font-weight:bold; letter-spacing:0.5px;">
      CYBER ECHO REVERSAL SIMULATION // V2.0
    </div>
  </div>

 * SHADOW.exe - Browser Engine (HTML5 Canvas + Web Audio API)
 * Theme: REVERSAL (Mandatory for solving every stage)
 *
 * Controls:
 * - Move: A / D or Left / Right Arrows
 * - Jump: W or Up Arrow (Space is strictly reserved for Shadow deployment!)
 * - Deploy Shadow: Space or E (when not near terminal)

 * - Read Archive: E when standing near terminal
 * - Quick Restart: R
 * - Menu: Escape

// --- AUDIO SYNTHESIZER (0 external files needed) ---
class CyberAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.droneOsc = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.startAmbient();
    } else if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted && this.ctx) {
      if (this.droneOsc) this.droneOsc.stop();
      this.droneOsc = null;
    } else if (!this.muted) {
      this.startAmbient();
    }
    return !this.muted;
  }

  startAmbient() {
    if (this.muted || !this.ctx || this.droneOsc) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(55, this.ctx.currentTime); // A1 note

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(140, this.ctx.currentTime);

      gain.gain.setValueAtTime(0.025, this.ctx.currentTime);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      this.droneOsc = osc;
    } catch (e) {}
  }

  playJump() {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.14);
  }

  playDeploy() {
    if (this.muted || !this.ctx) return;
    const notes = [220, 330, 440, 660];
    notes.forEach((freq, i) => {
      const now = this.ctx.currentTime + (i * 0.04);
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    });
  }

  playFlip() {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    // Downward & upward dramatic frequency sweep for time reversal
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.18);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.32);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.36);
  }

  playPlate() {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(540, now);
    osc.frequency.exponentialRampToValueAtTime(270, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.11);
  }

  playDoor() {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, now);
    osc.frequency.linearRampToValueAtTime(180, now + 0.25);
    gain.gain.setValueAtTime(0.09, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.3);
  }

  playDeath() {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(90, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.42);
  }

  playVictory() {
    if (this.muted || !this.ctx) return;
    const chord = [440, 554.37, 659.25, 880];
    chord.forEach((freq, idx) => {
      const now = this.ctx.currentTime + (idx * 0.08);
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.75);
    });
  }
}

// --- HOLLOW KNIGHT SUBTERRANEAN CYBER CAVERN BACKGROUND ---
const AMBIENT_SPORES = [];
for (let i = 0; i < 54; i++) {
  AMBIENT_SPORES.push({
    baseX: (i * 37.7) % CANVAS_W,
    baseY: (i * 29.3) % CANVAS_H,
    speed: 10 + (i % 6) * 3,
    amp: 16 + (i % 5) * 6,
    freq: 0.6 + (i % 4) * 0.3,
    phase: i * 0.8,
    sz: 1.2 + (i % 3) * 0.7,
    col: (i % 5 === 0) ? 'rgba(208, 0, 255, ' : (i % 3 === 0 ? 'rgba(255, 170, 0, ' : 'rgba(0, 240, 255, ')
  });
}

function drawHollowAtmosphere(ctx, time = 0) {
  // 1. Deep Cavern Gradient Sky/Void (Hollow Knight subterranean palette)
  const bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
  bgGrad.addColorStop(0, '#010408');
  bgGrad.addColorStop(0.45, '#040b17');
  bgGrad.addColorStop(0.85, '#061324');
  bgGrad.addColorStop(1, '#020710');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // 2. Distant Subterranean Gothic Pillars & Spires (Far Silhouette Depth)
  ctx.fillStyle = '#050d18';
  const pillars = [
    { x: 60, w: 50, top: 90 },
    { x: 230, w: 60, top: 70 },
    { x: 440, w: 75, top: 40 },
    { x: 670, w: 60, top: 70 },
    { x: 850, w: 50, top: 90 }
  ];

  for (const p of pillars) {
    ctx.fillRect(p.x, p.top, p.w, CANVAS_H - p.top);
    ctx.beginPath();
    ctx.moveTo(p.x - 10, p.top);
    ctx.lineTo(p.x + p.w / 2, p.top - 35);
    ctx.lineTo(p.x + p.w + 10, p.top);
    ctx.closePath();
    ctx.fill();

    // Subtle conduit fluting
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w / 2, p.top - 20);
    ctx.lineTo(p.x + p.w / 2, CANVAS_H);
    ctx.stroke();

    for (let ry = p.top + 80; ry < CANVAS_H; ry += 90) {
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
      ctx.strokeRect(p.x - 4, ry, p.w + 8, 8);
    }
  }

  // Connecting Gothic Archway Ribs
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
  ctx.lineWidth = 2;
  for (let i = 0; i < pillars.length - 1; i++) {
    const p1 = pillars[i];
    const p2 = pillars[i + 1];
    const midX = (p1.x + p1.w + p2.x) / 2;
    const archTop = Math.min(p1.top, p2.top) + 20;
    ctx.beginPath();
    ctx.moveTo(p1.x + p1.w, p1.top + 50);
    ctx.quadraticCurveTo(midX, archTop, p2.x, p2.top + 50);
    ctx.stroke();
  }

  // 3. Cavern Ceiling Stalactites
  ctx.fillStyle = '#040b15';
  const stalactites = [
    [0, 60, 25], [35, 95, 30], [80, 50, 20], [140, 110, 35], [200, 70, 25],
    [310, 85, 28], [370, 125, 40], [420, 60, 20], [530, 100, 32], [590, 75, 24],
    [650, 120, 38], [740, 65, 22], [800, 95, 30], [870, 110, 35], [930, 70, 30]
  ];
  for (const [sx, sh, sw] of stalactites) {
    ctx.beginPath();
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx + sw / 2, sh);
    ctx.lineTo(sx + sw, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.fillRect(sx + sw / 2 - 1, sh - 3, 2, 3);
    ctx.fillStyle = '#040b15';
  }

  // 4. Volumetric Ethereal Light Shafts (Hollow Knight God Rays)
  const rays = [
    { x1: 120, x2: 210, dx: 180, alpha: 0.04 },
    { x1: 390, x2: 520, dx: 240, alpha: 0.055 },
    { x1: 720, x2: 830, dx: 170, alpha: 0.04 }
  ];
  for (const ray of rays) {
    const pulse = 0.85 + 0.15 * Math.sin(time * 1.4 + ray.x1 * 0.01);
    const grad = ctx.createLinearGradient(ray.x1, 0, ray.x1 + ray.dx, CANVAS_H);
    grad.addColorStop(0, `rgba(0, 240, 255, ${ray.alpha * pulse * 1.4})`);
    grad.addColorStop(0.5, `rgba(0, 240, 255, ${ray.alpha * pulse})`);
    grad.addColorStop(1, 'rgba(0, 240, 255, 0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(ray.x1, 0);
    ctx.lineTo(ray.x2, 0);
    ctx.lineTo(ray.x2 + ray.dx, CANVAS_H);
    ctx.lineTo(ray.x1 + ray.dx, CANVAS_H);
    ctx.closePath();
    ctx.fill();
  }

  // 5. Undulating Abyss Void Mist (Atmospheric rolling fog)
  for (let layer = 0; layer < 2; layer++) {
    const speed = layer === 0 ? 0.7 : 1.1;
    const waveAmp = layer === 0 ? 10 : 6;
    const baseY = layer === 0 ? 575 : 590;
    const fogAlpha = layer === 0 ? 0.06 : 0.04;

    ctx.fillStyle = `rgba(0, 240, 255, ${fogAlpha})`;
    ctx.beginPath();
    ctx.moveTo(0, CANVAS_H);
    for (let x = 0; x <= CANVAS_W; x += 30) {
      const y = baseY + Math.sin(x * 0.015 + time * speed) * waveAmp
                      + Math.cos(x * 0.03 - time * speed * 0.7) * (waveAmp * 0.5);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(CANVAS_W, CANVAS_H);
    ctx.closePath();
    ctx.fill();
  }

  // 6. Floating Luminescent Spores (Hollow Knight drifting motes)
  for (const s of AMBIENT_SPORES) {
    const x = (s.baseX + Math.sin(time * s.freq + s.phase) * s.amp + CANVAS_W) % CANVAS_W;
    const y = ((s.baseY - time * s.speed) % CANVAS_H + CANVAS_H) % CANVAS_H;
    const pulse = 0.35 + 0.35 * Math.sin(time * 2.2 + s.phase);

    ctx.fillStyle = s.col + `${pulse.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(x, y, s.sz, 0, Math.PI * 2);
    ctx.fill();

    if (s.sz > 1.8) {
      ctx.fillStyle = s.col + `${(pulse * 0.25).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, y, s.sz * 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 7. Subtle Vignette
  const vig = ctx.createRadialGradient(CANVAS_W / 2, CANVAS_H / 2, 280, CANVAS_W / 2, CANVAS_H / 2, 600);
  vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vig.addColorStop(1, 'rgba(1, 4, 9, 0.45)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
}

// --- LEVEL INSTANCE RUNTIME ---
class LevelRunner {
  constructor(data) {
    this.data = data;
    this.solids = data.solids;
    this.plates = data.plates.map(p => ({
      ...p,
      isPressed: false,
      timer: 0
    }));
    this.doors = data.doors.map(d => ({
      ...d,
      openAmount: 0.0,
      isOpen: false
    }));
    this.terminal = { ...data.terminal, triggered: false };
    this.exit = { ...data.exit, rot: 0 };

    // Player
    this.player = {
      x: data.spawn.x,
      y: data.spawn.y,
      vx: 0,
      vy: 0,
      onGround: false,
      facing: 1,
      animTimer: 0,
      animFrame: 0,
      isDead: false
    };

    // History Recording Buffer
    this.history = [];
    this.recording = true;

    // Platforming Polish Timers
    this.coyoteTimer = 0;
    this.jumpBufferTimer = 0;

    // Shadow Clone
    this.shadow = {
      active: false,
      history: [],
      index: 0,
      playbackDir: 1, // 1 = forward, -1 = reversed
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      facing: 1,
      animFrame: 0,
      isReversed: false
    };

    this.complete = false;
  }

  update(dt) {
    if (this.player.isDead) return;

    // 1. Player Physics & Controls
    let moveDir = 0;
    if (keys.left) moveDir -= 1;
    if (keys.right) moveDir += 1;

    this.player.vx = moveDir * SPEED;
    this.player.vy += GRAVITY * dt;

    if (moveDir !== 0) {
      this.player.facing = moveDir;
      this.player.animTimer += dt * 10;
      this.player.animFrame = Math.floor(this.player.animTimer) % 8;
    } else {
      this.player.animFrame = 0;
    }

    // Coyote time & Jump buffering
    if (this.player.onGround) {
      this.coyoteTimer = 0.14;
    } else {
      this.coyoteTimer = Math.max(0, this.coyoteTimer - dt);
    }

    if (keys.jump) {
      this.jumpBufferTimer = 0.16;
    } else if (this.jumpBufferTimer > 0) {
      this.jumpBufferTimer = Math.max(0, this.jumpBufferTimer - dt);
    }

    // Jump execution
    if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0) {
      this.player.vy = JUMP_POWER;
      this.player.onGround = false;
      this.coyoteTimer = 0;
      this.jumpBufferTimer = 0;
      audio.playJump();
    }

    // Horizontal Movement & Collision
    this.player.x += this.player.vx * dt;
    this.resolveCollisionsX(this.player);

    // Vertical Movement & Collision
    this.player.y += this.player.vy * dt;
    this.player.onGround = false;
    this.resolveCollisionsY(this.player);

    // Record Player State (when shadow is not active)
    if (this.recording) {
      this.history.push({
        x: this.player.x,
        y: this.player.y,
        vx: this.player.vx,
        vy: this.player.vy,
        facing: this.player.facing,
        animFrame: this.player.animFrame
      });
    }

    // Void fall death check
    if (this.player.y > 615 && !this.player.isDead) {
      this.triggerDeath();
      return;
    }

    // 2. Deploy Shadow Action
    if (keys.deploy && this.recording && this.history.length > 5) {
      keys.deploy = false;
      this.deployShadow();
    }

    // 3. Shadow Flip Action (Reversal)
    if (keys.flip && this.shadow.active) {
      keys.flip = false;
      this.flipShadow();
    }

    // 4. Update Shadow Clone
    if (this.shadow.active) {
      this.updateShadow(dt);
    }

    // 5. Update Pressure Plates
    this.updatePlates(dt);

    // 6. Update Doors (Interpolate Opening)
    this.updateDoors(dt);

    // 7. Check Terminal Proximity
    this.checkTerminal();

    // 8. Check Exit Zone
    this.checkExit();

    // Exit ring rotation
    this.exit.rot += dt * 2;
  }

  resolveCollisionsX(entity) {
    const halfW = PLAYER_W / 2;
    const halfH = PLAYER_H / 2;
    const allSolids = [...this.solids];

    // Closed doors act as solid walls
    for (const d of this.doors) {
      if (d.openAmount < 0.8) {
        allSolids.push({
          x: d.x - d.w / 2,
          y: d.y - d.h / 2,
          w: d.w,
          h: d.h
        });
      }
    }

    for (const b of allSolids) {
      const bLeft = b.x;
      const bRight = b.x + b.w;
      const bTop = b.y;
      const bBottom = b.y + b.h;

      const pLeft = entity.x - halfW;
      const pRight = entity.x + halfW;
      const pTop = entity.y - halfH + 4;
      const pBottom = entity.y + halfH - 4;

      if (pRight > bLeft && pLeft < bRight && pBottom > bTop && pTop < bBottom) {
        if (entity.vx > 0) {
          entity.x = bLeft - halfW;
          entity.vx = 0;
        } else if (entity.vx < 0) {
          entity.x = bRight + halfW;
          entity.vx = 0;
        }
      }
    }
  }

  resolveCollisionsY(entity) {
    const halfW = PLAYER_W / 2;
    const halfH = PLAYER_H / 2;
    const allSolids = [...this.solids];

    for (const d of this.doors) {
      if (d.openAmount < 0.8) {
        allSolids.push({
          x: d.x - d.w / 2,
          y: d.y - d.h / 2,
          w: d.w,
          h: d.h
        });
      }
    }

    for (const b of allSolids) {
      const bLeft = b.x;
      const bRight = b.x + b.w;
      const bTop = b.y;
      const bBottom = b.y + b.h;

      const pLeft = entity.x - halfW + 3;
      const pRight = entity.x + halfW - 3;
      const pTop = entity.y - halfH;
      const pBottom = entity.y + halfH;

      if (pRight > bLeft && pLeft < bRight && pBottom > bTop && pTop < bBottom) {
        if (entity.vy > 0) {
          entity.y = bTop - halfH;
          entity.vy = 0;
          entity.onGround = true;
        } else if (entity.vy < 0) {
          entity.y = bBottom + halfH;
          entity.vy = 0;
        }
      }
    }
  }

  deployShadow() {
    this.shadow.active = true;
    this.shadow.history = [...this.history];
    this.shadow.index = 0;
    this.shadow.playbackDir = 1;
    this.shadow.isReversed = false;
    this.recording = false;
    audio.playDeploy();

    // Spawn deployment particle shockwave
    for (let i = 0; i < 20; i++) {
      const angle = (Math.PI * 2 * i) / 20;
      const spd = 80 + Math.random() * 60;
      addParticle(
        this.shadow.history[0].x,
        this.shadow.history[0].y,
        Math.cos(angle) * spd,
        Math.sin(angle) * spd,
        '#ff7700',
        3,
        0.5
      );
    }
  }

  flipShadow() {
    this.shadow.playbackDir *= -1;
    this.shadow.isReversed = !this.shadow.isReversed;
    screenShake = 6;
    audio.playFlip();

    // Glowing reversal burst particles
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 90 + Math.random() * 90;
      addParticle(
        this.shadow.x,
        this.shadow.y,
        Math.cos(angle) * spd,
        Math.sin(angle) * spd,
        this.shadow.isReversed ? '#d000ff' : '#ff7700',
        4,
        0.6
      );
    }
  }

  updateShadow(dt) {
    const s = this.shadow;
    s.index += s.playbackDir;

    // Loop or latch at boundaries
    if (s.index >= s.history.length) {
      s.index = s.history.length - 1;
    } else if (s.index < 0) {
      s.index = 0;
    }

    const frame = s.history[s.index];
    if (frame) {
      s.x = frame.x;
      s.y = frame.y;
      s.facing = (s.playbackDir === -1) ? -frame.facing : frame.facing;
      s.animFrame = frame.animFrame;
    }

    // Trail particle
    if (Math.random() < 0.4) {
      addParticle(
        s.x + (Math.random() - 0.5) * 10,
        s.y + (Math.random() - 0.5) * 16,
        -s.facing * 10,
        -15,
        s.isReversed ? '#d000ff' : '#ff7700',
        2.5,
        0.4
      );
    }
  }

  updatePlates(dt) {
    for (const plate of this.plates) {
      const pL = plate.x - plate.w / 2;
      const pR = plate.x + plate.w / 2;
      const pT = plate.y - plate.h / 2;
      const pB = plate.y + plate.h / 2;

      let standing = false;

      // Check player overlap
      if (
        this.player.x + PLAYER_W / 2 > pL &&
        this.player.x - PLAYER_W / 2 < pR &&
        this.player.y + PLAYER_H / 2 >= pT - 4 &&
        this.player.y - PLAYER_H / 2 < pB
      ) {
        standing = true;
      }

      // Check shadow overlap
      if (
        this.shadow.active &&
        this.shadow.x + PLAYER_W / 2 > pL &&
        this.shadow.x - PLAYER_W / 2 < pR &&
        this.shadow.y + PLAYER_H / 2 >= pT - 4 &&
        this.shadow.y - PLAYER_H / 2 < pB
      ) {
        standing = true;
      }

      if (standing) {
        plate.timer = plate.releaseDelay;
        if (!plate.isPressed) {
          plate.isPressed = true;
          audio.playPlate();
        }
      } else {
        if (plate.timer > 0) {
          plate.timer -= dt;
        } else {
          plate.isPressed = false;
        }
      }
    }
  }

  updateDoors(dt) {
    for (const door of this.doors) {
      // A door opens if ANY linked plate is pressed
      const shouldOpen = this.plates.some(p => p.doors.includes(door.id) && p.isPressed);

      if (shouldOpen) {
        if (door.openAmount < 1.0) {
          door.openAmount = Math.min(1.0, door.openAmount + dt * 3.5);
          if (door.openAmount === 1.0) audio.playDoor();
        }
      } else {
        if (door.openAmount > 0.0) {
          door.openAmount = Math.max(0.0, door.openAmount - dt * 3.5);
        }
      }
    }
  }

  checkTerminal() {
    const dist = Math.hypot(this.player.x - this.terminal.x, this.player.y - this.terminal.y);
    if (dist < 45) {
      if (keys.interact) {
        keys.interact = false;
        openModal(this.terminal.title, this.terminal.text);
      }
    }
  }

  checkExit() {
    const dist = Math.hypot(this.player.x - this.exit.x, this.player.y - this.exit.y);
    if (dist < 45 && !this.complete) {
      this.complete = true;
      audio.playVictory();
      nextLevel();
    }
  }

  triggerDeath() {
    this.player.isDead = true;
    screenShake = 12;
    audio.playDeath();
    deathTransition = 0.7;

    for (let i = 0; i < 35; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 120;
      addParticle(
        this.player.x,
        this.player.y,
        Math.cos(angle) * spd,
        Math.sin(angle) * spd,
        '#ff3344',
        3,
        0.6
      );
    }
  }

  draw(ctx, time = 0) {
    // 1. Draw Hollow Knight-style Subterranean Atmospheric Background
    drawHollowAtmosphere(ctx, time);

    // Hazard Void glow for pits
    ctx.fillStyle = 'rgba(255, 30, 60, 0.08)';
    ctx.fillRect(0, 590, CANVAS_W, 50);

    // 2. Draw Solids (Platforms, Pillars, Roofs)
    for (const b of this.solids) {
      ctx.fillStyle = b.color || '#0a121e';
      ctx.fillRect(b.x, b.y, b.w, b.h);

      ctx.strokeStyle = b.border || 'rgba(0, 240, 255, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(b.x, b.y, b.w, b.h);

      // Top edge neon accent
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + b.w, b.y);
      ctx.stroke();
    }

    // 3. Draw Pressure Plates
    for (const p of this.plates) {
      const active = p.isPressed;
      const pressOffset = active ? 4 : 0;
      const pL = p.x - p.w / 2;
      const pT = p.y - p.h / 2 + pressOffset;

      ctx.fillStyle = active ? '#ffaa00' : '#142336';
      ctx.fillRect(pL, pT, p.w, p.h - pressOffset);

      ctx.strokeStyle = active ? '#ffffff' : '#00f0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(pL, pT, p.w, p.h - pressOffset);

      // Plate glow halo
      if (active) {
        ctx.shadowColor = '#ff7700';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#ff7700';
        ctx.fillRect(pL + 6, pT, p.w - 12, 3);
        ctx.shadowBlur = 0;
      }
    }

    // 4. Draw Airlock Blast Doors
    for (const d of this.doors) {
      const dL = d.x - d.w / 2;
      const dT = d.y - d.h / 2;

      // Door frames (Top and Bottom housings)
      ctx.fillStyle = '#0a1626';
      ctx.fillRect(dL - 4, dT - 8, d.w + 8, 8);
      ctx.fillRect(dL - 4, dT + d.h, d.w + 8, 8);
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 1;
      ctx.strokeRect(dL - 4, dT - 8, d.w + 8, 8);
      ctx.strokeRect(dL - 4, dT + d.h, d.w + 8, 8);

      // Door barrier retraction (opens upward)
      const currentH = d.h * (1.0 - d.openAmount);
      if (currentH > 2) {
        // Solid metal door slab
        ctx.fillStyle = '#06101c';
        ctx.fillRect(dL, dT, d.w, currentH);

        // Electric forcefield beam
        ctx.shadowColor = '#ff3344';
        ctx.shadowBlur = 12;
        ctx.strokeStyle = '#ff3344';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(d.x, dT);
        ctx.lineTo(d.x, dT + currentH);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Energy pulses
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(dL + 2, dT + currentH);
        ctx.lineTo(dL + d.w - 2, dT + currentH);
        ctx.stroke();
      }
    }

    // 5. Draw Story Terminal
    const tDist = Math.hypot(this.player.x - this.terminal.x, this.player.y - this.terminal.y);
    ctx.fillStyle = '#061324';
    ctx.fillRect(this.terminal.x - 14, this.terminal.y - 32, 28, 36);
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(this.terminal.x - 14, this.terminal.y - 32, 28, 36);

    // Terminal screen glow
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(this.terminal.x - 10, this.terminal.y - 28, 20, 16);

    // Indicator prompt
    if (tDist < 45) {
      ctx.fillStyle = '#00f0ff';
      ctx.font = '11px "Share Tech Mono"';
      ctx.textAlign = 'center';
      ctx.fillText('[E] ACCESS ARCHIVE', this.terminal.x, this.terminal.y - 40);
    }

    // 6. Draw Exit Zone Portal
    const ex = this.exit.x;
    const ey = this.exit.y;
    ctx.save();
    ctx.translate(ex, ey);

    // Outer rotating ring
    ctx.rotate(this.exit.rot);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.7)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, 32, 0, Math.PI * 2);
    ctx.stroke();

    // Inner counter-rotating ring
    ctx.rotate(-this.exit.rot * 2);
    ctx.strokeStyle = 'rgba(255, 119, 0, 0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Core pulsing diamond
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 16;
    ctx.fillRect(-6, -6, 12, 12);
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.fillStyle = '#00f0ff';
    ctx.font = '11px "Orbitron"';
    ctx.textAlign = 'center';
    ctx.fillText('EXTRACTION PORTAL', ex, ey + 46);

    // 7. Draw Shadow Clone
    if (this.shadow.active) {
      const row = this.shadow.isReversed ? 2 : 1;
      const frameCol = this.shadow.animFrame;
      const sx = frameCol * 32;
      const sy = row * 32;

      ctx.save();
      ctx.translate(this.shadow.x, this.shadow.y);
      if (this.shadow.facing < 0) ctx.scale(-1, 1);

      // Shadow aura glow
      ctx.shadowColor = this.shadow.isReversed ? '#d000ff' : '#ff7700';
      ctx.shadowBlur = 14;

      ctx.drawImage(
        spritesheet,
        sx, sy, 32, 32,
        -16, -16, 32, 32
      );
      ctx.shadowBlur = 0;
      ctx.restore();

      // Shadow name tag
      ctx.fillStyle = this.shadow.isReversed ? '#d000ff' : '#ff7700';
      ctx.font = '10px "Share Tech Mono"';
      ctx.textAlign = 'center';
      const label = this.shadow.isReversed ? '<< REVERSED SHADOW' : 'ECHO SHADOW >>';
      ctx.fillText(label, this.shadow.x, this.shadow.y - 24);
    }

    // 8. Draw Player
    if (!this.player.isDead) {
      const row = 0; // Row 0 is Player
      const frameCol = this.player.animFrame;
      const sx = frameCol * 32;
      const sy = row * 32;

      ctx.save();
      ctx.translate(this.player.x, this.player.y);
      if (this.player.facing < 0) ctx.scale(-1, 1);

      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 12;

      ctx.drawImage(
        spritesheet,
        sx, sy, 32, 32,
        -16, -16, 32, 32
      );
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // 9. Draw Particle System
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * 0.016;
      p.y += p.vy * 0.016;
      p.life -= 0.016;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.globalAlpha = 1.0;
    }

    // 10. HUD On-Screen Elements
    ctx.textAlign = 'left';
    ctx.fillStyle = '#00f0ff';
    ctx.font = '13px "Orbitron"';
    ctx.fillText(`${this.data.name} // ${this.data.phase}`, 24, 32);

    ctx.fillStyle = '#8bb3cb';
    ctx.font = '12px "Share Tech Mono"';
    ctx.fillText(this.data.subtitle, 24, 50);

    // Shadow state badge
    let statusText = 'STATUS: RECORDING TRAJECTORY';
    let statusColor = '#00f0ff';
    if (this.shadow.active) {
      if (this.shadow.isReversed) {
        statusText = 'STATUS: SHADOW TIME-REVERSED [<<]';
        statusColor = '#d000ff';
      } else {
        statusText = 'STATUS: SHADOW REPLAYING [>>]';
        statusColor = '#ff7700';
      }
    }
    ctx.fillStyle = statusColor;
    ctx.font = '12px "Share Tech Mono"';
    ctx.fillText(statusText, 24, 70);

    // Red Death Flash Overlay
    if (this.player.isDead) {
      ctx.fillStyle = `rgba(255, 30, 60, ${deathTransition * 0.7})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px "Orbitron"';
      ctx.textAlign = 'center';
      ctx.fillText('SIGNAL SEVERED // SEQUENCE TERMINATED', CANVAS_W / 2, CANVAS_H / 2);
      ctx.font = '14px "Share Tech Mono"';
      ctx.fillText('VOID INTEGRITY FAILURE. REBOOTING RECORD...', CANVAS_W / 2, CANVAS_H / 2 + 30);
    }
  }
}

// Active Level Runner
let activeRunner = null;

function showLevelInstructions(data) {
  const instructions =
    `OPERATIONAL INSTRUCTIONS & CONTROLS:\n\n` +
    `  • [W] / [↑]          JUMP across platforms & void\n` +
    `  • [SPACE]            DEPLOY SHADOW (clone replays past recorded path)\n` +
    `  • [F]                FLIP (REVERSES time! Rewinds shadow backward)\n` +
    `  • [R]                RESET timeline sequence\n` +
    `  • [A] / [D] / [←][→]  MOVE / SPRINT left and right\n\n` +
    `MISSION OBJECTIVE:\n` +
    `Cooperate with your time-reversed shadow to press plates, open security blast doors, and reach the Extraction Portal.`;

  openModal(
    'PROTOCOL BRIEFING // CONTROLS & OBJECTIVE',
    instructions,
    'START GAME [SPACE / ENTER]'
  );
}

function loadLevel(idx, showBriefing = false) {
  currentLevelIndex = idx;
  const data = LEVELS[idx];
  activeRunner = new LevelRunner(data);

  // Update top navigation badges
  document.getElementById('hud-level-badge').innerText = data.name;
  document.getElementById('hud-phase-badge').innerText = data.phase;

  // Banner toast
  bannerText = data.name;
  bannerSub = data.subtitle;
  bannerTimer = 2.5;

  // Instructions ONLY appear before Level 1
  if (showBriefing && idx === 1 && gameState === STATE.PLAYING) {
    showLevelInstructions(data);
  }
}

function nextLevel() {
  if (currentLevelIndex < LEVELS.length - 1) {
    loadLevel(currentLevelIndex + 1, false);
  } else {
    // Campaign complete -> Victory Screen
    gameState = STATE.VICTORY;
    victoryTimer = 0;
    audio.playVictory();
  }
}

function restartLevel() {
  if (activeRunner) {
    loadLevel(currentLevelIndex, false);
  }
}

// --- TITLE MENU & VICTORY DRAWING ---
function drawMenu(ctx, time) {
  drawHollowAtmosphere(ctx, time);

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#00f0ff';
  ctx.font = '900 48px "Orbitron"';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 18;
  ctx.fillText('SHADOW FLIP', CANVAS_W / 2, 120);
  ctx.shadowBlur = 0;

  // Tagline
  ctx.fillStyle = '#ff7700';
  ctx.font = '16px "Share Tech Mono"';
  ctx.fillText('"Your shadow remembers everything you regret."', CANVAS_W / 2, 155);

  // Character Dossier Cards Preview
  const cardY = 220;
  const cardW = 240;
  const cardH = 150;

  // 1. Echo Card (Cyan)
  drawCard(ctx, CANVAS_W / 2 - 380, cardY, cardW, cardH, '#00f0ff', 'CYBER PROJECTION', 'ECHO', 0, time);

  // 2. Shadow Card (Orange)
  drawCard(ctx, CANVAS_W / 2 - 120, cardY, cardW, cardH, '#ff7700', 'PAST RECORDING', 'SHADOW', 1, time);

  // 3. Reverse Shadow Card (Violet)
  drawCard(ctx, CANVAS_W / 2 + 140, cardY, cardW, cardH, '#d000ff', 'REVERSED SIGNAL', 'REVERSE SHADOW', 2, time);

  // Menu Options / Buttons Info
  ctx.fillStyle = '#ffffff';
  ctx.font = '18px "Orbitron"';
  ctx.fillText('PRESS [SPACE] OR CLICK BELOW TO INITIALIZE', CANVAS_W / 2, 430);

  // Interactive Button Rects
  drawMenuButton(ctx, CANVAS_W / 2 - 160, 460, 320, 44, '▶ START CAMPAIGN (LEVEL 1)', '#00f0ff');
  drawMenuButton(ctx, CANVAS_W / 2 - 160, 515, 320, 38, '📖 TUTORIAL', '#ff7700');
}

function drawCard(ctx, x, y, w, h, color, tag, title, row, time) {
  ctx.fillStyle = '#06111f';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);

  // Animated sprite in center
  const frame = Math.floor(time * 6) % 8;
  ctx.save();
  ctx.translate(x + w / 2, y + 55);
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.drawImage(spritesheet, frame * 32, row * 32, 32, 32, -24, -24, 48, 48);
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.fillStyle = color;
  ctx.font = '10px "Share Tech Mono"';
  ctx.fillText(tag, x + w / 2, y + 105);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px "Orbitron"';
  ctx.fillText(title, x + w / 2, y + 124);
}

function drawMenuButton(ctx, x, y, w, h, text, color) {
  ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);

  ctx.fillStyle = color;
  ctx.font = 'bold 13px "Orbitron"';
  ctx.textAlign = 'center';
  ctx.fillText(text, x + w / 2, y + h / 2 + 5);
}

function drawVictory(ctx, time) {
  drawHollowAtmosphere(ctx, time);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#00f0ff';
  ctx.font = '900 42px "Orbitron"';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 20;
  ctx.fillText('SYSTEM ESCAPE COMPLETE', CANVAS_W / 2, 150);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#ff7700';
  ctx.font = 'bold 22px "Orbitron"';
  ctx.fillText('IDENTITY VERIFIED: YOU ARE THE ECHO.', CANVAS_W / 2, 220);

  ctx.fillStyle = '#e0f4ff';
  ctx.font = '16px "Share Tech Mono"';
  ctx.fillText('The red shadow was the original entity, preserved after system reset.', CANVAS_W / 2, 280);
  ctx.fillText('You were only the projected echo sent forward.', CANVAS_W / 2, 310);
  ctx.fillText('By reversing time and cooperating with your past self,', CANVAS_W / 2, 340);
  ctx.fillText('the recursive containment cycle has shattered.', CANVAS_W / 2, 370);

  drawMenuButton(ctx, CANVAS_W / 2 - 140, 460, 280, 48, 'RETURN TO TITLE MENU', '#00f0ff');
}

// --- MODAL DIALOG ---
const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalText = document.getElementById('modal-text');
const modalCloseBtn = document.getElementById('modal-close-btn');

function openModal(title, text, btnText = 'ACKNOWLEDGE [SPACE / ENTER]') {
  modalTitle.innerText = title;
  modalText.innerText = text;
  modalCloseBtn.innerText = btnText;
  modalOverlay.style.display = 'flex';
}

function closeModal() {
  modalOverlay.style.display = 'none';
  keys.left = false;
  keys.right = false;
  keys.jump = false;
  keys.deploy = false;
  keys.flip = false;
  keys.interact = false;
}

modalCloseBtn.addEventListener('click', closeModal);

// --- INPUT EVENT LISTENERS ---
window.addEventListener('keydown', (e) => {
  audio.init();

  if (modalOverlay.style.display === 'flex') {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') {
      closeModal();
      e.preventDefault();
      return;
    }
  }

  if (gameState === STATE.MENU) {
    if (e.code === 'Space' || e.code === 'Enter') {
      gameState = STATE.PLAYING;
      loadLevel(1, true);
    }
    return;
  }

  if (gameState === STATE.VICTORY) {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') {
      gameState = STATE.MENU;
    }
    return;
  }

  switch (e.code) {
    case 'KeyA':
    case 'ArrowLeft':
      keys.left = true;
      break;
    case 'KeyD':
    case 'ArrowRight':
      keys.right = true;
      break;
    case 'KeyW':
    case 'ArrowUp':
      keys.jump = true;
      break;
    case 'Space':
      keys.deploy = true;
      e.preventDefault();
      break;
    case 'KeyF':
    case 'KeyQ':
      keys.flip = true;
      break;
    case 'KeyE':
      keys.interact = true;
      break;
    case 'KeyR':
      restartLevel();
      break;
    case 'Escape':
      gameState = STATE.MENU;
      break;
  }
});

window.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyA':
    case 'ArrowLeft':
      keys.left = false;
      break;
    case 'KeyD':
    case 'ArrowRight':
      keys.right = false;
      break;
    case 'KeyW':
    case 'ArrowUp':
      keys.jump = false;
      if (activeRunner && activeRunner.player && activeRunner.player.vy < -160) {
        activeRunner.player.vy *= 0.55;
      }
      break;
    case 'Space':
      keys.deploy = false;
      break;
    case 'KeyF':
    case 'KeyQ':
      keys.flip = false;
      break;
    case 'KeyE':
      keys.interact = false;
      break;
  }
});

// Canvas Click for Menus
canvas.addEventListener('click', (e) => {
  audio.init();
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const clickX = (e.clientX - rect.left) * scaleX;
  const clickY = (e.clientY - rect.top) * scaleY;

  if (gameState === STATE.MENU) {
    // Start Campaign button
    if (clickX >= CANVAS_W / 2 - 160 && clickX <= CANVAS_W / 2 + 160 && clickY >= 460 && clickY <= 504) {
      gameState = STATE.PLAYING;
      loadLevel(1, true);
    }
    // Tutorial button
    else if (clickX >= CANVAS_W / 2 - 160 && clickX <= CANVAS_W / 2 + 160 && clickY >= 515 && clickY <= 553) {
      gameState = STATE.PLAYING;
      loadLevel(0);
    }
  } else if (gameState === STATE.VICTORY) {
    if (clickX >= CANVAS_W / 2 - 140 && clickX <= CANVAS_W / 2 + 140 && clickY >= 460 && clickY <= 508) {
      gameState = STATE.MENU;
    }
  }
});

// Top Navigation Buttons
document.getElementById('btn-menu').addEventListener('click', () => {
  audio.init();
  gameState = STATE.MENU;
});

document.getElementById('btn-tutorial').addEventListener('click', () => {
  audio.init();
  gameState = STATE.PLAYING;
  loadLevel(0);
});

document.getElementById('btn-restart').addEventListener('click', () => {
  audio.init();
  restartLevel();
});

document.getElementById('btn-sound').addEventListener('click', () => {
  audio.init();
  const on = audio.toggleMute();
  document.getElementById('btn-sound').innerText = on ? 'SOUND: ON' : 'SOUND: OFF';
});

document.getElementById('btn-fullscreen').addEventListener('click', () => {
  const elem = document.getElementById('game-container');
  if (!document.fullscreenElement) {
    elem.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

// --- MAIN GAME LOOP ---
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const timeSec = now / 1000;

  ctx.save();

  // Screen shake
  if (screenShake > 0) {
    const ox = (Math.random() - 0.5) * screenShake * 2;
    const oy = (Math.random() - 0.5) * screenShake * 2;
    ctx.translate(ox, oy);
    screenShake = Math.max(0, screenShake - dt * 25);
  }

  if (gameState === STATE.PLAYING) {
    if (activeRunner) {
      if (modalOverlay.style.display !== 'flex') {
        activeRunner.update(dt);

        // Death transition timer
        if (activeRunner.player.isDead) {
          deathTransition -= dt;
          if (deathTransition <= 0) {
            restartLevel();
          }
        }
      }
      activeRunner.draw(ctx, timeSec);
    }
  } else if (gameState === STATE.MENU) {
    drawMenu(ctx, timeSec);
  } else if (gameState === STATE.VICTORY) {
    drawVictory(ctx, timeSec);
  }

  ctx.restore();

  requestAnimationFrame(gameLoop);
}

// Initialize
loadLevel(1);
gameState = STATE.MENU;
requestAnimationFrame(gameLoop);
